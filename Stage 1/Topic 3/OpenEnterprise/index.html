<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/logo.svg" />

    <!-- STYLES -->
    <link rel="stylesheet" href="./styles/general/bootstrap.css" />
    <link rel="stylesheet" href="./styles/general/global.css" />
    <link rel="stylesheet" href="./styles/pages/home.css" />

    <title>Open Enterprise</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header-content">
          <div class="header-brand">
            <img class="brand-logo" src="./assets/images/logo.svg" />
            <h1 class="brand-title">Open Enterprise</h1>
          </div>
          <nav class="navbar">
            <ul class="nav-list">
              <li class="nav-item">
                <a class="nav-link" href="#">Why Open Enterprise</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Contribute</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="#">Request early access</a>
              </li>
            </ul>
          </nav>

          <a class="mobile-menu">
            <img src="./assets/icons/menu.svg" />
          </a>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="container">
      <section class="hero">
        <div class="hero-left">
          <h2 class="hero-title">A new model for open collaboration</h2>
          <p class="hero-desc">
            Run an organization where members get rewarded for their
            contributions with fractional ownership.
          </p>
          <button class="btn">Request early access</button>
        </div>
        <div class="hero-right">
          <img class="hero-img" src="./assets/images/hero.svg" />
        </div>
      </section>
    </main>

    <footer class="footer"></footer>
  </body>
</html>
